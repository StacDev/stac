name: all_plugins

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'website/**'
      - '**.md'
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'website/**'
      - '**.md'

jobs:
  analyze:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@c85c95e3d7251135ab7dc9ce3241c5835cc595a9
      - uses: subosito/flutter-action@48cafc24713cca54bbe03cdc3a423187d413aafa
        with:
          channel: 'stable'
          cache: true
      - uses: bluefireteam/melos-action@dd3c344d731938d2ab2567a261f54a19a68b5f6a
        with:
          melos-version: '3.0.1'
      # Flutter 3.50 deprecates these libraries in favor of the material_ui and
      # cupertino_ui packages. A deprecation is only an info, which doesn't fail
      # analyze, so this step keeps the old imports and exports from coming
      # back. tools/ isn't checked: stac-vscode's preview_host is on stac 1.x.
      - name: 'Check for deprecated Material and Cupertino imports'
        run: |
          if git grep -nE "^[[:space:]]*(import|export)[[:space:]]+['\"]package:flutter/(material|cupertino)\.dart['\"]" -- ':(glob)packages/**/*.dart' ':(glob)examples/**/*.dart' ':(glob)stac_playground/**/*.dart'; then
            echo "Import package:material_ui/material_ui.dart or package:cupertino_ui/cupertino_ui.dart instead."
            exit 1
          fi
      - name: 'Run Analyze'
        run: melos run analyze

  pub_get_check:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@c85c95e3d7251135ab7dc9ce3241c5835cc595a9
      - uses: subosito/flutter-action@48cafc24713cca54bbe03cdc3a423187d413aafa
        with:
          channel: 'stable'
          cache: true
      - uses: bluefireteam/melos-action@dd3c344d731938d2ab2567a261f54a19a68b5f6a
        with:
          melos-version: '3.0.1'
      - name: 'Flutter Pub Get'
        run: melos run get

  # Runs on Linux, so this is also what catches paths whose casing only works
  # on a case-insensitive filesystem — the analyze and format jobs never touch
  # the platform directories or the asset bundle.
  build_playground:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@c85c95e3d7251135ab7dc9ce3241c5835cc595a9
      - uses: subosito/flutter-action@48cafc24713cca54bbe03cdc3a423187d413aafa
        with:
          channel: 'stable'
          cache: true
      - uses: bluefireteam/melos-action@dd3c344d731938d2ab2567a261f54a19a68b5f6a
        with:
          melos-version: '3.0.1'
      - name: 'Build web'
        run: flutter build web
        working-directory: stac_playground
      - name: 'Test'
        run: flutter test
        working-directory: stac_playground

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@c85c95e3d7251135ab7dc9ce3241c5835cc595a9
      - uses: subosito/flutter-action@48cafc24713cca54bbe03cdc3a423187d413aafa
        with:
          channel: 'stable'
          cache: true
      - uses: bluefireteam/melos-action@dd3c344d731938d2ab2567a261f54a19a68b5f6a
        with:
          melos-version: '3.0.1'
      - name: 'Dart format'
        run: |
          melos run format
          ./.github/workflows/scripts/validate-formatting.sh